[project]
name = "abc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "jsonargparse[signatures]>=4.52.0",
    "lightning>=2.6.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "wandb>=0.30.0",
]

[project.scripts]
falljepa = "falljepa:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "falljepa"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
