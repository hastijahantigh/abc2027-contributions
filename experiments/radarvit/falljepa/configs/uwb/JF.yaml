# JF: the join-free model (docs/falljepa_join_free.md), one config for the subject-held-out CV
# (docs/stream_cv.md). It keeps RS's trunk and recipe (AP + radar dropout + dense SWA, complex I/Q
# input, 32 s windows) and drops everything that reasons over source recordings: no join detector,
# units, labeller channels, official rule or gate.
#
#   stage 1   3 fall queries per window (DETR): P(fall), start and end distributions, matched to the
#             falls wholly inside the window
#   stage 2   the proposals of overlapping windows are grouped by span overlap; a refiner reads each
#             group's members, its region's stream tokens (all windows, centre-weighted) and the
#             event physics (the scene before vs after the group's span) and gives up to 2 falls
#   training  chunks of 4 inference windows (32 s, 6 s apart: 50 s), so stage 2 trains on the
#             proposals of overlapping windows as at inference; 8 chunks = 32 windows per optimizer
#             step, as 2 accumulated batches of 4 chunks: 6.4 GB peak in nvidia-smi on ABC27 with
#             PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (tools/run_jf_cv.sh sets it); one batch
#             of 8 chunks peaks at 11.6 GB
#   decoding  one event per slot with P > .5, MBR span, duplicates removed at tIoU .5. The same run
#             writes <name>.queries.csv (stage 1, non-learned merge) and <name>.dense.csv (dense head,
#             Viterbi): the join-free ladder
#
# 15 epochs, dense SWA from epoch 3; no checkpoint is chosen on the held-out streams: validate
# checkpoints/swa.ckpt.
#
#   FOLDS="A B C D" GPU=0 tools/run_jf_cv.sh

seed_everything: 0

run:
  project: abc2027-fall-jepa
  group: UWB/JF
  name: JF
  notes: >-
    Join-free: per-window fall queries + a learned stream stage over groups of overlapping proposals
    (stream tokens, event physics), on the AP + radar dropout + dense SWA trunk, complex I/Q input,
    32 s windows; subject-held-out CV.
  tags: [uwb, frame, join-free, sets, complex, cv]
  wandb: offline
trainer:
  max_epochs: 15
  accelerator: auto
  devices: 1
  precision: 32-true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2      # 2 x 4 chunks per optimizer step (GPU memory)
  num_sanity_val_steps: 0
  log_every_n_steps: 20
  check_val_every_n_epoch: 5      # progress only: nothing is selected on the held-out streams
  callbacks:
    - class_path: falljepa.callbacks.WeightAveraging
      init_args: {start_epoch: 2, bn_batches: 50, every_n_steps: 50}
checkpoint:
  monitor: null
  save_top_k: 1
data:
  release: DATA/folds/A
  stats_path: runs/_cache/fold_A/normalizer.json
  normalizer: interior
  train_splits: [train]
  val_splits: [val]
  test_splits: [val]
  window_s: 32.0                  # 1600 timesteps = 400 frames
  train_hop_s: 8.0                # chunks (50 s) on an 8 s grid: as many steps per epoch as RS
  infer_hop_s: 6.0
  infer_tail: pad
  fall_sets: true
  chunk_windows: 4                # a training item: 4 inference windows, 6 s apart
  train_sampler: balanced
  sampler:
    fall_slots: 2                 # of 4 chunks
    hard_slots: 1
    hard_label: Autre
    groups: DATA/folds/A/groups.csv
  frame_width: 32
  frame_stride: 4
  diff_channel: false
  complex_input: true
  physics: true
  units: false
  num_states: 2
  boundary_s: 0.3
  boundary_mask_s: 0.2
  flagged_weight: 0.0
  flagged_margin_s: 2.0
  augment:
    radar_drop_p: 0.15
  batch_size: 4                   # chunks = 16 windows; 2 batches per optimizer step
  eval_batch_size: 16
  num_workers: 10
model:
  model:
    class_path: falljepa.model.FallSetJEPA
    init_args:
      d_model: 64
      nhead: 4
      mlp_ratio: 2
      pre_proj_ratio: 2
      frame_patch_size: [23, 8]   # 8 rows of 23 complex bins
      frame_pooling: cls
      frame_encoder_layers: 2
      context_layers: 2
      bidir_layers: 2
      predictor_layers: 2
      pred_horizons: [8]
      detach_target: true
      num_states: 2
      dropout: 0.1
      num_queries: 3
      query_layers: 2
      group_slots: 2
      group_layers: 2
      event_physics: true
      proposal_threshold: 0.05
      group_iou: 0.2
      group_margin_s: 3.0
      group_max_s: 20.0
      max_members: 12
      max_groups: 6
      member_drop: 0.25
      span_jitter_s: 0.2
      fall_jitter_s: 0.3
      negative_groups: 1
  losses:
    State_Frame:
      class_path: falljepa.loss.StateCELoss
      init_args: {logits_key: frame_logits, target_key: frame_state, weight_key: frame_weight,
                  class_weights: [1.0, 1.0]}
    State_Step:
      class_path: falljepa.loss.StateCELoss
      init_args: {logits_key: step_logits_flat, target_key: step_state, weight_key: step_weight,
                  class_weights: [1.0, 1.0]}
    MSE_Latent:
      class_path: falljepa.loss.MSELoss
      init_args: {pred_key: z_v_pred, target_key: z_v_target}
    SIGReg:
      class_path: falljepa.loss.SIGRegLoss
      init_args: {latent_key: z_v_proj, batch_size: 32}
    Query_Obj:                    # P(fall) of each window query (set-matched)
      class_path: falljepa.loss.UnitBCELoss
      init_args: {logit_key: q_logit, target_key: q_target, weight_key: q_w}
    Query_Span:
      class_path: falljepa.loss.SpanSoftCELoss
      init_args: {target_key: q_span, weight_key: q_span_w, logits_key: q_span_logits, domain_key: q_domain, sigma: 5.0}
    Group_Obj:                    # P(fall) of each group slot
      class_path: falljepa.loss.UnitBCELoss
      init_args: {logit_key: g_logit, target_key: g_target, weight_key: g_w}
    Group_Span:
      class_path: falljepa.loss.SpanSoftCELoss
      init_args: {target_key: g_span, weight_key: g_span_w, logits_key: g_span_logits, domain_key: g_domain, sigma: 5.0}
  loss_weights:
    State_Frame: 0.5
    State_Step: 0.25
    MSE_Latent: 0.25
    SIGReg: 0.1
    Query_Obj: 1.0
    Query_Span: 1.0
    Group_Obj: 1.0
    Group_Span: 1.0
  decoder:
    kind: sets
    threshold: 0.5
    proposal_threshold: 0.05
    group_iou: 0.2
    nms_iou: 0.5
  window_weight: triangular
  window_merge: prob
  decode_every_n_epochs: 1
  ignore_flagged: true
  optimizer:
    class_path: falljepa.optimizer.AdamWConstant
    init_args:
      learning_rate: 1.0e-3
      weight_decay: 1.0e-4
