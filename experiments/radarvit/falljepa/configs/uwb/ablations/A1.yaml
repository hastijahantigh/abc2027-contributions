# -c: `__delete__` removes a key.
run:
  notes: "A1: no JEPA loss, no latent predictor Hv; SIGReg stays."
model:
  model:
    init_args:
      predictor_layers: 0
  losses:
    MSE_Latent: __delete__
  loss_weights:
    MSE_Latent: __delete__
